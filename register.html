<script>
(function () {
  "use strict";
  //MATH-START
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = a => Math.sqrt(dot(a, a)), unit = a => mul(a, 1 / len(a));
  const mv = (M, v) => [dot(M[0], v), dot(M[1], v), dot(M[2], v)];
  const mm = (A, B) => A.map(r => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
  const tr = A => [0, 1, 2].map(i => [A[0][i], A[1][i], A[2][i]]);
  const det = A => dot(A[0], cross(A[1], A[2]));
  const col = (A, j) => [A[0][j], A[1][j], A[2][j]];
  const fromCols = (a, b, c) => [[a[0], b[0], c[0]], [a[1], b[1], c[1]], [a[2], b[2], c[2]]];
  const I3 = () => [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  function euler(yaw, pitch, roll) { // R = Rz(yaw) Ry(pitch) Rx(roll), degrees
    const [a, b, c] = [yaw, pitch, roll].map(x => x * Math.PI / 180);
    const Rz = [[Math.cos(a), -Math.sin(a), 0], [Math.sin(a), Math.cos(a), 0], [0, 0, 1]], Ry = [[Math.cos(b), 0, Math.sin(b)], [0, 1, 0], [-Math.sin(b), 0, Math.cos(b)]], Rx = [[1, 0, 0], [0, Math.cos(c), -Math.sin(c)], [0, Math.sin(c), Math.cos(c)]];
    return mm(Rz, mm(Ry, Rx));
  }
  function eigSym3(A) { // Jacobi; returns vals + V (columns = eigenvectors), sorted descending
    const a = A.map(r => r.slice()), V = I3();
    for (let sw = 0; sw < 60; sw++) {
      const off = a[0][1] ** 2 + a[0][2] ** 2 + a[1][2] ** 2; if (off < 1e-30) break;
      for (let p = 0; p < 3; p++) for (let q = p + 1; q < 3; q++) {
        if (Math.abs(a[p][q]) < 1e-300) continue;
        const th = (a[q][q] - a[p][p]) / (2 * a[p][q]), t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1)), c = 1 / Math.sqrt(t * t + 1), s = t * c;
        for (let k = 0; k < 3; k++) { const x = a[k][p], y = a[k][q]; a[k][p] = c * x - s * y; a[k][q] = s * x + c * y; }
        for (let k = 0; k < 3; k++) { const x = a[p][k], y = a[q][k]; a[p][k] = c * x - s * y; a[q][k] = s * x + c * y; }
        for (let k = 0; k < 3; k++) { const x = V[k][p], y = V[k][q]; V[k][p] = c * x - s * y; V[k][q] = s * x + c * y; }
      }
    }
    const idx = [0, 1, 2].sort((i, j) => a[j][j] - a[i][i]);
    return { vals: idx.map(i => a[i][i]), V: fromCols(col(V, idx[0]), col(V, idx[1]), col(V, idx[2])) };
  }
  function svd3(H) { // H = U S V^T
    const e = eigSym3(mm(tr(H), H)), V = e.V, S = e.vals.map(x => Math.sqrt(Math.max(0, x)));
    const v1 = col(V, 0), v2 = col(V, 1), v3 = col(V, 2);
    const u1 = unit(mv(H, v1)); let u2 = mv(H, v2); u2 = unit(sub(u2, mul(u1, dot(u1, u2))));
    let u3 = cross(u1, u2); const hv3 = mv(H, v3); if (dot(u3, hv3) < 0) u3 = mul(u3, -1);
    return { U: fromCols(u1, u2, u3), S, V };
  }
  const centroid = P => mul(P.reduce(add, [0, 0, 0]), 1 / P.length);
  function kabsch(PL, PC) { // finds R, t with PC ≈ R PL + t
    const cL = centroid(PL), cC = centroid(PC), qL = PL.map(p => sub(p, cL)), qC = PC.map(p => sub(p, cC));
    const H = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    qL.forEach((a, i) => { const b = qC[i]; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) H[r][c] += a[r] * b[c]; });
    const { U, S, V } = svd3(H);
    const d0 = det(mm(V, tr(U)));
    const Vf = d0 < 0 ? fromCols(col(V, 0), col(V, 1), mul(col(V, 2), -1)) : V;
    const R = mm(Vf, tr(U)), t = sub(cC, mv(R, cL));
    const res = PL.map((p, i) => len(sub(add(mv(R, p), t), PC[i])));
    const rmse = Math.sqrt(res.reduce((s, e) => s + e * e, 0) / res.length);
    return { cL, cC, qL, qC, H, U, S, V, d0, R, t, res, rmse, flipped: d0 < 0 };
  }
  const rotErrDeg = (A, B) => Math.acos(Math.max(-1, Math.min(1, ((A[0][0] * B[0][0] + A[0][1] * B[0][1] + A[0][2] * B[0][2] + A[1][0] * B[1][0] + A[1][1] * B[1][1] + A[1][2] * B[1][2] + A[2][0] * B[2][0] + A[2][1] * B[2][1] + A[2][2] * B[2][2]) - 1) / 2))) * 180 / Math.PI;
  // boards in the LiDAR frame (holes: 50 cm x 40 cm grid, order TL, TR, BR, BL)
  const BOARDS = [{ c: [3.0, 0.0, 0.05], yaw: 8, tilt: 0 }, { c: [2.6, 1.9, -0.15], yaw: -36, tilt: 15 }, { c: [3.3, -1.8, 0.35], yaw: 29, tilt: -10 }];
  function holesOf(b) {
    const y = b.yaw * Math.PI / 180, tl = b.tilt * Math.PI / 180, u = [Math.sin(y), Math.cos(y), 0], n0 = [Math.cos(y), -Math.sin(y), 0];
    const v = add(mul([0, 0, 1], Math.cos(tl)), mul(n0, Math.sin(tl)));
    return [[-0.25, 0.2], [0.25, 0.2], [0.25, -0.2], [-0.25, -0.2]].map(h => add(b.c, add(mul(u, h[0]), mul(v, h[1]))));

  function makeData(nb, Rt, tt, sigma, seed) {
    const r = rng(seed), g = () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());
    const L0 = [].concat(...BOARDS.slice(0, nb).map(holesOf));

    const L = L0.map(p => add(p, [g() * s, g() * s, g() * s]));
    const C = L0.map(p => add(add(mv(Rt, p), tt), [g() * s, g() * s, g() * s]));
    return { L, C };
  }
  function icpRun(L, C, R0, t0, maxIt) { // point-to-point ICP with nearest-neighbour correspondences
    const hist = [{ R: R0, t: t0, match: null }]; let R = R0, t = t0, prev = "";
    for (let k = 0; k < maxIt; k++) {
      const X = L.map(p => add(mv(R, p), t));
      const match = X.map(x => { let bi = 0, bd = Infinity; C.forEach((c, j) => { const d = len(sub(x, c)); if (d < bd) { bd = d; bi = j; } }); return bi; });

      hist[hist.length - 1].match = match; hist[hist.length - 1].dist = dist;
      const key = match.join(","); if (key === prev) { hist.converged = true; break; } prev = key;
      const k2 = kabsch(L, match.map(j => C[j])); R = k2.R; t = k2.t;
      hist.push({ R, t, match: null });
    }
    const last = hist[hist.length - 1];
    if (!last.match) { const X = L.map(p => add(mv(R, p), t)); last.match = X.map(x => { let bi = 0, bd = Infinity; C.forEach((c, j) => { const d = len(sub(x, c)); if (d < bd) { bd = d; bi = j; } }); return bi; }); last.dist = X.map((x, i) => len(sub(x, C[last.match[i]]))); }
    return hist;
  }
  //MATH-END
  if (typeof document === "undefined") { module.exports = { kabsch, icpRun, makeData, euler, rotErrDeg, mm, mv, sub, add, det, centroid }; return; }

  // ---------------- quaternion helpers for smooth animation ----------------
  function quatFromR(m) {
    const t = m[0][0] + m[1][1] + m[2][2]; let w, x, y, z;
    if (t > 0) { const s = Math.sqrt(t + 1) * 2; w = s / 4; x = (m[2][1] - m[1][2]) / s; y = (m[0][2] - m[2][0]) / s; z = (m[1][0] - m[0][1]) / s; }
    else if (m[0][0] > m[1][1] && m[0][0] > m[2][2]) { const s = Math.sqrt(1 + m[0][0] - m[1][1] - m[2][2]) * 2; w = (m[2][1] - m[1][2]) / s; x = s / 4; y = (m[0][1] + m[1][0]) / s; z = (m[0][2] + m[2][0]) / s; }
    else if (m[1][1] > m[2][2]) { const s = Math.sqrt(1 + m[1][1] - m[0][0] - m[2][2]) * 2; w = (m[0][2] - m[2][0]) / s; x = (m[0][1] + m[1][0]) / s; y = s / 4; z = (m[1][2] + m[2][1]) / s; }
    else { const s = Math.sqrt(1 + m[2][2] - m[0][0] - m[1][1]) * 2; w = (m[1][0] - m[0][1]) / s; x = (m[0][2] + m[2][0]) / s; y = (m[1][2] + m[2][1]) / s; z = s / 4; }

  }

    const pr = (ST.icp && ST.icpAll ? ST.all.concat(ST.icpAll) : ST.all).map(p => { const q = sub(p, ST.fitC); return [dot(q, B.r), dot(q, B.u)]; });
    const x0 = Math.min(...pr.map(p => p[0])), x1 = Math.max(...pr.map(p => p[0])), y0 = Math.min(...pr.map(p => p[1])), y1 = Math.max(...pr.map(p => p[1]));
    SC = Math.min((W - 60) / Math.max(0.5, x1 - x0), (Hh - topPad - botPad - 40) / Math.max(0.5, y1 - y0));
    OX = W / 2 - SC * (x0 + x1) / 2; OY = topPad + 20 + (Hh - topPad - botPad - 40) / 2 + SC * (y0 + y1) / 2;
    // floor grid (0.5 m)
    const fc = ST.fitC, R0 = Math.ceil(ST.fitR / 0.5) * 0.5 + 0.5, z = ST.floorZ;
    g.lineWidth = 1;
    for (let k = -R0; k <= R0 + 1e-9; k += 0.5) {
      const x = Math.round((fc[0] + k) * 2) / 2, y = Math.round((fc[1] + k) * 2) / 2;
      line([x, fc[1] - R0, z], [x, fc[1] + R0, z], "#17222e", 1); line([fc[0] - R0, y, z], [fc[0] + R0, y, z], "#17222e", 1);
    }
    // origin axes
    [[[0.5, 0, 0], "#e2685f", "x"], [[0, 0.5, 0], "#5fcf9a", "y"], [[0, 0, 0.5], "#1e9bd7", "z"]].forEach(a => { line([0, 0, 0], a[0], a[1], 2); const s = P2(a[0]); g.fillStyle = a[1]; g.font = "600 11px IBM Plex Mono, monospace"; g.fillText(a[2], s[0] + 3, s[1] - 3); });
    { const s = P2([0, 0, 0]); g.fillStyle = "#8a9bb0"; g.font = "11px IBM Plex Sans KR, sans-serif"; g.fillText("원점", s[0] + 6, s[1] + 14); }
    const pose = curPose(), Rq = RfromQuat(pose.q), K = ST.K, D = ST.D;
    const Ld = D.L.map(p => add(mv(Rq, sub(p, K.cL)), pose.mL)), Cd = D.C.map(p => add(sub(p, K.cC), pose.mC));
    const moved = len(sub(pose.mL, K.cL)) > 1e-6 || len(sub(pose.mC, K.cC)) > 1e-6 || Math.abs(pose.q[0]) < 0.99999;
    // ghosts of the original measurements
    if (moved) { boardsOutline(D.L, "#1e9bd7", 0.18); boardsOutline(D.C, "#6f9be0", 0.18); D.L.forEach(p => ptL(p, 0.16, 4)); D.C.forEach(p => ptC(p, 0.16, 4)); }
    const s = ST.step;
    boardsOutline(Ld, "#1e9bd7", 0.55); boardsOutline(Cd, "#6f9be0", 0.65);
    if (ST.icp) {
      const h = ST.icpHist[ST.icpK], X = Ld;
      const settled = !ST.from || (performance.now() - ST.t0) >= ST.dur;
      if (settled) h.match.forEach((j, i) => line(X[i], Cd[j], j === i ? "#5fcf9a" : "#e2685f", 2));
    } else {
      if (s >= 1 && s <= 5) Ld.forEach((p, i) => line(p, Cd[i], "rgba(200,214,230,.45)", 1.2, [4, 4]));
      if (s === 2) { cross2(K.cL, "#e8b84a", "c_L"); cross2(K.cC, "#e8b84a", "c_C"); }
      if (s === 3) { arrow(K.cL, [0, 0, 0], "rgba(232,184,74,.6)", "− c_L"); arrow(K.cC, [0, 0, 0], "rgba(232,184,74,.6)", "− c_C"); }
      if (s === 4) text("원점에서 q_L(원)을 R만큼 회전 → q_C(네모)와 겹침", 16, Hh - (W < 600 ? 88 : 62), "#e8b84a");
      if (s === 5) { const rc = mv(K.R, K.cL); cross2(rc, "rgba(232,184,74,.7)", "R·c_L"); cross2(K.cC, "#e8b84a", "c_C"); if ((pose.t || 1) >= 0.999) arrow(rc, K.cC, "#e8b84a", "t = c_C − R·c_L"); }
      if (s === 6) Ld.forEach((p, i) => { const e = sub(p, Cd[i]); line(Cd[i], add(Cd[i], mul(e, 30)), "#e8b84a", 2.5); });
    }

    // camera squares drawn larger underneath so overlapping pairs read as a circle inside a square
    Cd.forEach(p => ptC(p, 1, 7)); Ld.forEach(p => ptL(p, 1, 4.6));
    if (!ST.icp && s <= 2) { g.font = "10px IBM Plex Mono, monospace"; g.fillStyle = "#8a9bb0"; Ld.forEach((p, i) => { const q = P2(p); g.fillText(i + 1, q[0] + 7, q[1] - 6); }); }
    // set labels
    if (!ST.icp && s < 3) { const top = (P, lo) => { const q = P.map(P2); const y = lo ? Math.max(...q.map(a => a[1])) + 34 : Math.min(...q.map(a => a[1])); const x = q.reduce((a, b) => a + b[0], 0) / q.length; return [x, y]; }; const a = top(Ld), b = top(Cd, true); text('LiDAR가 본 구멍 중심 (LiDAR 좌표)', a[0] - 90, a[1] - 22, '#1e9bd7'); text('카메라가 본 구멍 중심 (카메라 좌표)', b[0] - 90, b[1] - 22, '#9dbbea'); }
    if (s === 6 && !ST.icp) text("노란 선 = 점별 오차 × 30 (확대)", 16, Hh - (W < 600 ? 88 : 62), "#e8b84a");
    if (moved && !ST.icp) text("흐린 점 = 원래 측정 위치", 16, Hh - (W < 600 ? 66 : 40), "#8a9bb0", "11px IBM Plex Sans KR, sans-serif");
  }
  function loop() { draw(); requestAnimationFrame(loop); }
  // drag to orbit the view
  let drag = null;
  cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
  cv.addEventListener("pointermove", e => { if (!drag) return; ST.view.phi -= (e.clientX - drag[0]) * 0.4; ST.view.th = Math.max(3, Math.min(89.5, ST.view.th + (e.clientY - drag[1]) * 0.4)); drag = [e.clientX, e.clientY]; });
  cv.addEventListener("pointerup", () => { drag = null; cv.style.cursor = ""; });

  const m = /s(\d)/.exec(location.hash); if (m) ST.step = Math.min(6, +m[1]);
  syncOut(); resize(); recompute();
  if (/icp/.test(location.hash)) { const a = /icp(\d+)/.exec(location.hash); if (a) el("icp-ang").value = a[1]; syncOut(); toggleICP(true); ST.icpK = ST.icpHist.length - 1; goPose(icpPose(ST.icpK), true); panel(); }
  loop();
})();
</script>
