<style>
/* layout: header tabs · 3D viewport (rviz style, single dark look) · sensor panel (side on desktop, below on phone) */
:root {
  --bg: #0b1118; --panel: #121b26; --line: #22303f; --fg: #e6edf5; --muted: #8a9bb0;
  --sky: #1e9bd7; --navy: #002b68; --warn: #e8b84a; --board: #c9d6e6;
  --f-ui: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); }
.app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 16px; gap: 14px; box-sizing: border-box; }
header { display: grid; gap: 10px; }
.hrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 4px 12px 4px 4px; }
.brand { font-weight: 700; letter-spacing: .02em; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: 0; }
.links { display: flex; gap: 10px; flex-wrap: wrap; }
.links a { color: var(--muted); text-decoration: none; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; }
.links a:hover { color: var(--fg); border-color: var(--sky); }
.links a[aria-current="page"] { color: #fff; background: var(--sky); border-color: var(--sky); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 600 13px var(--f-ui); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tab[aria-selected="true"] { color: #fff; background: var(--sky); border-color: var(--sky); }
.tab:focus-visible, .cam:focus-visible, .view button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 10px; min-height: 0; }
.stage { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #13202d, var(--bg) 70%); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; transform: translate(-50%, -130%); font: 500 11px var(--f-mono); color: var(--fg); background: rgba(11,17,24,.72); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
.lbl.lcam { color: var(--sky); } .lbl.warn { color: var(--warn); } .lbl.board { color: var(--board); font-size: 10px; background: transparent; }
.lbl.dim { opacity: .25; }
.hud { position: absolute; left: 16px; top: 16px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.hud .t { font-weight: 700; font-size: 18px; } .hud .s { color: var(--muted); font-size: 12px; }
.view { position: absolute; right: 16px; top: 16px; display: flex; gap: 6px; }
.view button { font: 500 12px var(--f-ui); color: var(--fg); background: rgba(18,27,38,.85); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.legend { position: absolute; left: 16px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); pointer-events: none; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
aside h2 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.cam { text-align: left; width: 100%; box-sizing: border-box; min-width: 0; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 4px; }
.cam[aria-pressed="true"] { border-color: var(--sky); background: rgba(30,155,215,.10); }
.cam .n { font: 600 13px var(--f-mono); display: flex; justify-content: space-between; gap: 8px; }
.cam .n span { color: var(--muted); font: 400 11px var(--f-ui); }
.cam dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12px; }
.cam dt { color: var(--muted); } .cam dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.pill { font: 600 10px var(--f-ui); padding: 1px 6px; border-radius: 999px; background: rgba(232,184,74,.15); color: var(--warn); }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 8px; }
@media (max-width: 820px) {
  .app { height: auto; min-height: 100%; }
  main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 360px; }
  aside { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

      camObjs[cm.name] = { frus, face, dot, links, el, cm };
      const btn = document.createElement("button"); btn.className = "cam"; btn.setAttribute("aria-pressed", "false");
      btn.innerHTML = `<div class="n">${cm.name}${cm.warn ? ' <b class="pill">보드 부족</b>' : ""}<span>${cm.kr ? cm.kr : ""}</span></div><dl>${cm.stats.map(s => `<dt>${s[0]}</dt><dd>${s[1]}</dd>`).join("")}</dl>`;
      btn.addEventListener("click", () => select(selected === cm.name ? null : cm.name));
      camObjs[cm.name].btn = btn; list.appendChild(btn);
    });
    root.userData.boardObjs = boardObjs;
    // bounds
    const bb = new THREE.Box3().setFromObject(box); d.cams.forEach(c => bb.expandByPoint(V(c.p))); d.boards.forEach(b => bb.expandByPoint(V(b.c)));
    bounds = bb; setView("chase");
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.k === key ? "true" : "false"));
  }

  function select(name) {
    selected = name;
    Object.entries(camObjs).forEach(([n, o]) => {
      const on = !name || n === name;
      o.frus.material.opacity = on ? 0.95 : 0.15; o.face.material.opacity = on ? (name ? 0.16 : 0.08) : 0.02;
      if (o.links) o.links.material.opacity = name ? (n === name ? 0.9 : 0.03) : 0.18;
      o.el.classList.toggle("dim", !on); o.btn.setAttribute("aria-pressed", n === name ? "true" : "false");
    });
    (root.userData.boardObjs || []).forEach(o => {
      const on = !name || o.b.cams.includes(name);
      o.grp.children.forEach(ch => { ch.material.opacity = on ? (ch.isMesh ? 0.32 : 0.9) : 0.06; });
      o.el.classList.toggle("dim", !on);
    });
  }

  function setView(kind) {
    const c = bounds.getCenter(new THREE.Vector3()), s = bounds.getSize(new THREE.Vector3()), r = Math.max(s.x, s.y, 7);
    const pos = { chase: [c.x - r * 0.95, c.y - r * 0.55, c.z + r * 0.6], top: [c.x, c.y - 0.01, c.z + r * 1.35], side: [c.x, c.y - r * 1.3, c.z + r * 0.25] }[kind];
    cam.position.set(...pos); ctl.target.copy(c); ctl.update();
  }
  ["chase", "top", "side"].forEach(k => document.getElementById("v-" + k).addEventListener("click", () => setView(k)));

  const tabs = document.getElementById("tabs");
  KEYS.forEach(k => { const b = document.createElement("button"); b.className = "tab"; b.role = "tab"; b.dataset.k = k; b.textContent = DATA[k].title; b.addEventListener("click", () => { location.hash = k; }); tabs.appendChild(b); });
  function route() { const k = (location.hash || "").slice(1); build(KEYS.includes(k) ? k : KEYS[0]); }
  window.addEventListener("hashchange", route);

  function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage);
  const tmp = new THREE.Vector3();
  function loop() {
    ctl.update(); renderer.render(scene, cam);
    const w = stage.clientWidth, h = stage.clientHeight;
    labels.forEach(({ el, pos }) => { tmp.copy(pos).project(cam); const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1; el.hidden = !vis; if (vis) { el.style.left = ((tmp.x + 1) / 2 * w) + "px"; el.style.top = ((1 - tmp.y) / 2 * h) + "px"; } });
    requestAnimationFrame(loop);
  }
  resize(); route(); loop();
})();
</script>

</body></html>
